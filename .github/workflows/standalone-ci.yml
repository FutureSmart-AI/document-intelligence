name: Product CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: standalone-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Format, lint, unit tests, build, e2e
    # Playwright 1.58.2 cannot install Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/.next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}-

      - run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # Includes src/data/__tests__/apiContract.test.ts: every route is checked
      # against the Knowledge contract, and any other service named anywhere
      # under src/ fails the run.
      - name: Unit tests
        run: bun run test

      # `next build` type-checks the whole project, so there is no separate
      # typecheck step.
      - name: Build static export
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Against the static export just built, every API call stubbed in the
      # browser. The fixture fails any call that is not Knowledge or auth.
      - name: E2E (stubbed Knowledge)
        run: bunx playwright test --grep-invert "live"
        env:
          E2E_WEB_SERVER: preview

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  model-eval-offline:
    name: Model evaluation grader checks (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # stdlib only: grading, chart comparison, telemetry fallbacks, dataset integrity, report.
      - run: python3 -m unittest discover -s tests/unit -p test_model_eval.py -v

  image-builds:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            dockerfile: deploy/docker/api.Dockerfile
          - component: worker
            context: workers
            dockerfile: workers/Dockerfile.celery
          - component: ui
            context: frontend
            dockerfile: frontend/Dockerfile.standalone
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: di-check:${{ matrix.component }}
          cache-from: type=gha,scope=di-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=di-${{ matrix.component }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.component == 'api'
        with:
          bun-version-file: frontend/package.json
      - name: Verify frontend contract against this backend source
        if: matrix.component == 'api'
        working-directory: .
        run: |
          mkdir -p .artifacts
          docker run --rm --env-file .env.example -e AUTH_MODE=hosted -e ENV_FILE=/dev/null -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/.artifacts:/output" di-check:api python -m scripts.export_openapi /output/openapi.json
          cd frontend
          bun install --frozen-lockfile
          bun scripts/gen-knowledge-contract.ts --check --spec ../.artifacts/openapi.json
      - name: API standalone checks
        if: matrix.component == 'api'
        working-directory: .
        run: docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_standalone_install.py -v
      - name: Hard document scope checks
        if: matrix.component == 'api'
        working-directory: .
        run: |
          docker run -d --name di-scope-qdrant qdrant/qdrant:v1.15.1
          trap 'docker rm -f di-scope-qdrant' EXIT
          docker run --rm --network container:di-scope-qdrant --env-file .env.example -e SCOPE_TEST_QDRANT_URL=http://127.0.0.1:6333 -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_search_scope.py -v
          docker run --rm --network container:di-scope-qdrant --env-file .env.example -e POPULATION_TEST_QDRANT_URL=http://127.0.0.1:6333 -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_metadata_population.py -v
      - name: Extraction context checks
        if: matrix.component == 'api'
        working-directory: .
        run: docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_extraction_context.py -v
      - name: API key scope checks
        if: matrix.component == 'api'
        working-directory: .
        run: docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_api_key_scope.py -v
      - name: Chart checks (population, aggregation, node wiring)
        if: matrix.component == 'api'
        working-directory: .
        run: >-
          docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro"
          -v "$PWD/requirements-dev.txt:/tmp/requirements-dev.txt:ro" di-check:api
          sh -c "pip install -q -r /tmp/requirements-dev.txt && python -m pytest -q -p no:cacheprovider
          tests/unit/test_chart_population.py tests/unit/test_chart_node.py tests/unit/test_chart_generator_chunk_text.py
          tests/unit/test_numeric_answer_consistency.py tests/unit/test_set_question_completeness.py
          tests/unit/test_follow_up_result_set.py tests/unit/test_evidence_builder.py"
      - name: Single-key install checks (local chart renderer, OpenAI-only defaults, model profiles)
        if: matrix.component == 'api'
        working-directory: .
        run: >-
          docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro"
          -v "$PWD/workers:/app/workers:ro" -v "$PWD/deploy:/app/deploy:ro"
          -v "$PWD/requirements-dev.txt:/tmp/requirements-dev.txt:ro" di-check:api
          sh -c "pip install -q -r /tmp/requirements-dev.txt && python -m pytest -q -p no:cacheprovider
          tests/unit/test_local_chart_renderer.py tests/unit/test_single_key_defaults.py tests/unit/test_model_profiles.py"
      - name: Enrichment model registry checks (worker mirror, variants, config validation, preview, pricing)
        if: matrix.component == 'api'
        working-directory: .
        run: >-
          docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro"
          -v "$PWD/workers:/app/workers:ro"
          -v "$PWD/requirements-dev.txt:/tmp/requirements-dev.txt:ro" di-check:api
          sh -c "pip install -q -r /tmp/requirements-dev.txt && python -m pytest -q -p no:cacheprovider
          tests/unit/test_enrichment_model_registry.py"
      - name: Sample collection isolation checks
        if: matrix.component == 'api'
        working-directory: .
        run: docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_sample_collections.py -v
      - name: Internal account limit checks
        if: matrix.component == 'api'
        working-directory: .
        run: docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_internal_accounts.py -v
      - name: Resume years definition checks
        if: matrix.component == 'api'
        working-directory: .
        run: docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_resume_years_definition.py -v
      - name: Usage telemetry checks (run-level collector, pricing, document telemetry)
        if: matrix.component == 'api'
        working-directory: .
        run: docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p "test_*telemetry*.py" -v && docker run --rm --env-file .env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests:/app/tests:ro" di-check:api python -m unittest discover -s tests/unit -p test_run_usage.py -v
      - name: Worker credential checks
        if: matrix.component == 'worker'
        working-directory: .
        run: docker run --rm --env-file workers/.env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests/worker:/app/testing:ro" di-check:worker python -m unittest discover -s testing -p test_standalone_credentials.py -v
      - name: Audio duration checks
        if: matrix.component == 'worker'
        working-directory: .
        run: docker run --rm --env-file workers/.env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests/worker:/app/testing:ro" -v "$PWD/tests/fixtures/files:/app/fixtures:ro" di-check:worker python -m unittest discover -s testing -p test_audio_duration.py -v
      - name: Production workload broker checks
        if: matrix.component == 'worker'
        working-directory: .
        run: docker run --rm --env-file workers/.env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests/worker:/app/testing:ro" di-check:worker python -m unittest discover -s testing -p test_production_broker.py -v
      - name: Parser fallback checks
        if: matrix.component == 'worker'
        working-directory: .
        run: docker run --rm --env-file workers/.env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests/worker:/app/testing:ro" di-check:worker python -m unittest discover -s testing -p test_parser_fallback.py -v
      - name: Extraction reference date checks
        if: matrix.component == 'worker'
        working-directory: .
        run: docker run --rm --env-file workers/.env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests/worker:/app/testing:ro" di-check:worker python -m unittest discover -s testing -p test_enrichment_reference_date.py -v
      - name: Extraction reasoning-effort override checks
        if: matrix.component == 'worker'
        working-directory: .
        run: docker run --rm --env-file workers/.env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests/worker:/app/testing:ro" di-check:worker python -m unittest discover -s testing -p test_enrichment_reasoning_override.py -v
      - name: Extraction model variant checks (gpt-5.6-luna-low)
        if: matrix.component == 'worker'
        working-directory: .
        run: docker run --rm --env-file workers/.env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests/worker:/app/testing:ro" di-check:worker python -m unittest discover -s testing -p test_enrichment_model_variants.py -v
      - name: Document processing telemetry checks
        if: matrix.component == 'worker'
        working-directory: .
        run: docker run --rm --env-file workers/.env.example -e AWS_EC2_METADATA_DISABLED=true -v "$PWD/tests/worker:/app/testing:ro" di-check:worker python -m unittest discover -s testing -p test_document_telemetry.py -v
