# =============================================================================
# model_prices.yaml — canonical source-of-truth for service pricing.
# =============================================================================
# Mirrors the currently-ACTIVE rows in `service_pricing` (effective_to IS NULL).
# It is the baseline the weekly pricing routine diffs published prices against.
#
# HOW IT'S USED:
#   - The weekly cloud routine reads this file, fetches each provider's current
#     published prices, diffs, and (on a change) opens a PR updating BOTH this
#     file and a generated SCD-2 migration, then pings Google Chat. A human merges.
#   - Prices are versioned (close old row / insert new), never edited in place,
#     because the app freezes cost onto each event at write time.
#
# CONVENTIONS:
#   - `pricing_details` is a 1:1 mirror of the JSONB column for that row.
#   - LLM/embedding token prices are USD per 1,000,000 tokens (per_1m_tokens).
#   - A row is uniquely keyed by (service_name, provider, service_type).
#   - `source` is the official pricing page to verify the number against.
#
# ROUTINE SCOPE (v1): only `service_type: llm` rows are auto-checked. Non-LLM
#   entries are kept as a faithful baseline but updated manually for now.
#
# Regenerated from PROD on 2026-08-03 (40 active rows). Do not hand-edit prices
# without a matching service_pricing change.
# =============================================================================

